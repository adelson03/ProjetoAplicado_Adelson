<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Aplicado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #0066cc; border: none; color: white; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #004fb3; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Área Restrita</h2>
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" placeholder="Digite seu usuário">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••••••">
        </div>
        <button onclick="handleLogin()">Entrar</button>
    </div>
    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Validação de exemplo para fins de portfólio (substituir por API/Auth segura em produção)
            if (user === "admin" && pass === "SUA_SENHA_SEGURA_AQUI") {
                sessionStorage.setItem('auth_token', 'token_ativo_seguro');
                window.location.href = "dashboard.html";
            } else {
                alert('Credenciais inválidas!');
            }
        }
    </script>
</body>
</html>
